name: wazuh-03

services:
  wazuh.manager:
    image: wazuh/wazuh-manager:${WAZUH_VERSION:-4.14.6}
    hostname: wazuh.manager
    restart: unless-stopped
    cpus: 1.0
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "30306:1514"
      - "30307:1515"
      - "127.0.0.1:30308:1516"
      - "30309:514/udp"
      - "127.0.0.1:30301:55000"
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ${WAZUH_DEPLOYMENT_CONFIG_PATH}/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - ${WAZUH_DEPLOYMENT_CONFIG_PATH}/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ${WAZUH_DEPLOYMENT_CONFIG_PATH}/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
      - ${WAZUH_DEPLOYMENT_CONFIG_PATH}/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf:ro
    networks:
      - wazuh-03

  wazuh.indexer:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION:-4.14.6}
    hostname: wazuh.indexer
    restart: unless-stopped
    cpus: 1.0
    ports:
      - "127.0.0.1:30304:9200"
      - "127.0.0.1:30305:9300"
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ${WAZUH_DEPLOYMENT_CONFIG_PATH}/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem:ro
      - ${WAZUH_DEPLOYMENT_CONFIG_PATH}/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key:ro
      - ${WAZUH_DEPLOYMENT_CONFIG_PATH}/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem:ro
      - ${WAZUH_DEPLOYMENT_CONFIG_PATH}/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem:ro
      - ${WAZUH_DEPLOYMENT_CONFIG_PATH}/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem:ro
      - ${WAZUH_DEPLOYMENT_CONFIG_PATH}/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      - ${WAZUH_DEPLOYMENT_CONFIG_PATH}/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro
    networks:
      - wazuh-03

  wazuh.dashboard:
    image: node:${NODE_VERSION:-18.19.0}
    hostname: wazuh.dashboard
    restart: "no"
    init: true
    cpus: 0.5
    working_dir: /workspace/wazuh-dashboard
    ports:
      - "127.0.0.1:30300:5601"
    environment:
      - NODE_OPTIONS=--max-old-space-size=4096
      - OSD_OPTIMIZER_MAX_WORKERS=1
      - JOBS=1
      - npm_config_jobs=1
      - MAKEFLAGS=-j1
    volumes:
      - ${REPO_PATH}:/source/wazuh-dashboard:ro
      - ${REPO_PATH}/.git:/workspace/wazuh-dashboard/.git:ro
      - ${REPO_PATH}/node_modules:/workspace/wazuh-dashboard/node_modules:ro
      - ${WAZUH_DASHBOARD_PLUGINS_REPO_PATH}:/source/wazuh-dashboard-plugins:ro
      - ${WAZUH_DASHBOARD_PLUGINS_REPO_PATH}/plugins/main:/workspace/wazuh-dashboard/plugins/main:ro
      - ${WAZUH_DASHBOARD_PLUGINS_REPO_PATH}/plugins/wazuh-check-updates:/workspace/wazuh-dashboard/plugins/wazuh-check-updates:ro
      - ${WAZUH_DASHBOARD_PLUGINS_REPO_PATH}/plugins/wazuh-core:/workspace/wazuh-dashboard/plugins/wazuh-core:ro
      - ${WAZUH_DASHBOARD_PLUGINS_REPO_PATH}/plugins/main/node_modules:/workspace/wazuh-dashboard-plugins/plugins/main/node_modules:ro
      - ${WAZUH_FARSI_REPO_PATH}:/source/wazuh-farsi:ro
      - ${WAZUH_FARSI_REPO_PATH}/dist/fa-IR-rtl/plugins/wazuh-farsi:/workspace/wazuh-dashboard/plugins/wazuh-farsi
      - ${WAZUH_FARSI_REPO_PATH}/package:/workspace/wazuh-dashboard/packages/wazuh-farsi:ro
      - ${WAZUH_FARSI_REPO_PATH}/package:/workspace/wazuh-dashboard/plugins/main/node_modules/wazuh-farsi:ro
      - ${WAZUH_RTL_REPO_PATH}:/source/wazuh-rtl:ro
      - ${WAZUH_RTL_REPO_PATH}/plugins/wazuh-rtl:/workspace/wazuh-dashboard/plugins/wazuh-rtl:ro
      - ${SECURITY_PLUGIN_REPO_PATH}:/source/wazuh-security-dashboards-plugin:ro
      - ${SECURITY_PLUGIN_REPO_PATH}:/workspace/wazuh-dashboard/plugins/wazuh-security-dashboards-plugin:ro
      - ${WAZUH_FARSI_REPO_PATH}/package:/workspace/wazuh-dashboard/plugins/wazuh-security-dashboards-plugin/node_modules/wazuh-farsi:ro
      - ${SECURITY_PLUGIN_REPO_PATH}/node_modules:/workspace/wazuh-security-dashboards-plugin/node_modules:ro
      - ${WAZUH_DEPLOYMENT_CONFIG_PATH}/wazuh_indexer_ssl_certs:/certs-source:ro
    command: ["/source/wazuh-dashboard/docker/start-wazuh-source.sh"]
    depends_on:
      - wazuh.indexer
      - wazuh.manager
    networks:
      - wazuh-03

networks:
  wazuh-03:
    name: wazuh-03
    driver: bridge
    ipam:
      config:
        - subnet: 100.64.3.0/24
          gateway: 100.64.3.1

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
